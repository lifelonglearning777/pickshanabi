<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PICKS HANABI</title>
<!-- Optional web font (I / l / 1 distinct). Falls back to system UD fonts if offline. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;600;700&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* ---------- tokens ---------- */
  :root{
    --font-en:"Andika","BIZ UDPGothic","Yu Gothic","Noto Sans JP",Arial,sans-serif;
    --font-ja-round:"Zen Maru Gothic","BIZ UDPGothic","Yu Gothic","Noto Sans JP",sans-serif;
    --font-ui:"Fredoka","Andika","BIZ UDPGothic","Yu Gothic",Arial,sans-serif;
    --font-ja:"BIZ UDPGothic","Yu Gothic","Noto Sans JP","Hiragino Sans",sans-serif;
    --navy:#0F172A;
    --panel:rgba(15,23,42,.72);
    --panel-border:rgba(148,197,255,.45);
    --white:#FFFFFF;
    --blue:#3B82F6;  --blue-2:#60A5FA;
    --pink:#EC4899;  --pink-2:#F472B6;
    --yellow:#FACC15;--yellow-2:#FDE047;
    --cream:#FFF7E6;
    --cyan:#22D3EE;
    --safe-w:1040px; --safe-h:600px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--font-en);
    color:var(--white);
    background:var(--navy);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  .ja{font-family:var(--font-ja)}
  button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
  button:focus-visible,input:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}

  /* ---------- screens ---------- */
  #bg{position:fixed;inset:0;z-index:0;background:url("assets/background_main.jpg") center/cover no-repeat}
  body[data-screen="play"] #bg{background-image:url("assets/background_play.jpg")}
  .screen{position:fixed;inset:0;display:none}
  .screen.is-active{display:block;z-index:2}

  /* safe area: centred box that scales down, never clips key UI */
  .safe{
    position:absolute;left:50%;top:50%;
    width:min(var(--safe-w),96vw);
    height:min(var(--safe-h),96vh);
    transform:translate(-50%,-50%);
    display:flex;flex-direction:column;align-items:center;
  }

  /* sky decorations (PNG fireworks) — outside the safe area */
  .fw{position:absolute;pointer-events:none;user-select:none;width:clamp(120px,22vw,320px);opacity:.95}
  .fw img{width:100%;height:auto;display:block}

  /* ---------- shared components ---------- */
  .panel{
    background:var(--panel);
    border:2px solid var(--panel-border);
    border-radius:20px;
    backdrop-filter:blur(6px);
    box-shadow:0 8px 30px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.15);
  }
  .chip{
    display:inline-flex;align-items:center;gap:.5em;
    padding:.55em 1.1em;border-radius:14px;
    background:rgba(15,23,42,.78);border:2px solid var(--panel-border);
    font-weight:700;letter-spacing:.03em;font-size:14px;
    box-shadow:0 4px 14px rgba(0,0,0,.4);
  }
  .chip svg{width:1.2em;height:1.2em;fill:currentColor}
  .icon-btn{
    display:flex;flex-direction:column;align-items:center;gap:6px;
    width:106px;padding:12px 6px 10px;border-radius:14px;white-space:nowrap;
    background:rgba(15,23,42,.78);border:2px solid var(--panel-border);
    font-size:11px;font-weight:700;letter-spacing:.03em;
    box-shadow:0 4px 14px rgba(0,0,0,.4);
  }
  .icon-btn svg{width:28px;height:28px;fill:var(--white)}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:.5em;
    font-weight:800;letter-spacing:.04em;
    border-radius:18px;color:var(--white);
    box-shadow:0 6px 0 rgba(0,0,0,.35),0 10px 24px rgba(0,0,0,.4);
    transition:transform .08s;
  }
  .btn:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.35)}
  .btn[disabled]{opacity:.5;filter:saturate(.45);cursor:default;pointer-events:none;transform:none}
  .btn[disabled]:active{transform:none}
  .inputwrap.is-locked .typebox{opacity:.55}
  .btn svg{width:1.15em;height:1.15em;fill:currentColor;flex:0 0 auto;margin-top:-.05em}
  .btn-blue{background:linear-gradient(180deg,var(--blue-2),var(--blue));border:2px solid #BFDBFE}
  .btn-pink{background:linear-gradient(180deg,var(--pink-2),var(--pink));border:2px solid #FBCFE8}
  .btn-yellow{background:linear-gradient(180deg,var(--yellow-2),var(--yellow));color:#1E1B4B;border:2px solid #FEF3C7}

  /* ================= HOME ================= */
  #home .logo{width:clamp(220px,26vw,330px);height:auto;filter:drop-shadow(0 8px 16px rgba(0,0,0,.5));margin-top:0}
  #home .panel.main{
    width:min(640px,100%);
    padding:20px 24px 22px;
    margin-top:12px;
    display:grid;gap:16px;
  }
  .label{display:flex;align-items:center;gap:.5em;font-size:15px;font-weight:700;letter-spacing:.06em}
  .label svg{width:1.1em;height:1.1em;fill:currentColor}
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .mode{
    display:grid;grid-template-columns:56px 1fr;align-items:center;gap:14px;
    padding:12px 18px;border-radius:999px;text-align:left;
    box-shadow:0 5px 0 rgba(0,0,0,.35),0 8px 20px rgba(0,0,0,.35);
    min-height:72px;
  }
  .mode > span{text-align:center}
  .mode b{display:block;font-size:24px;font-weight:800;letter-spacing:.05em;line-height:1.1}
  .mode small{display:block;font-size:12px;opacity:.95;margin-top:2px}
  .mode-copy{background:linear-gradient(180deg,#60A5FA,#2563EB);border:3px solid #BFDBFE}
  .mode-recall{background:linear-gradient(180deg,#F472B6,#DB2777);border:3px solid #FBCFE8}
  .mode.is-selected{outline:3px solid var(--white);outline-offset:3px}
  .divider{height:2px;background:rgba(148,197,255,.35);border-radius:2px}
  .row2{display:grid;grid-template-columns:1fr auto;gap:22px;align-items:start}
  .times{display:flex;gap:10px;margin-top:10px}
  .time{
    flex:1;padding:12px 8px;border-radius:14px;font-size:18px;font-weight:700;
    background:rgba(15,23,42,.7);border:2px solid var(--panel-border);
    box-shadow:0 4px 12px rgba(0,0,0,.35);
  }
  .time.is-selected{background:linear-gradient(180deg,#3B82F6,#1D4ED8);border-color:#93C5FD;box-shadow:0 0 0 3px rgba(96,165,250,.4),0 4px 12px rgba(0,0,0,.35)}
  .meaning{
    padding:12px 16px;border-radius:14px;
    background:rgba(15,23,42,.6);border:2px solid var(--panel-border);
    text-align:center;min-width:220px;
  }
  .meaning .top{display:flex;justify-content:center;align-items:center;gap:12px}
  .meaning p{font-size:12px;opacity:.9;margin-top:6px;line-height:1.35}
  .toggle{
    display:inline-flex;align-items:center;gap:8px;padding:3px 4px 3px 14px;border-radius:999px;
    background:var(--blue);font-size:13px;font-weight:800;box-shadow:inset 0 2px 4px rgba(0,0,0,.3);
  }
  .toggle::after{content:"";width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.4)}
  .start{width:min(340px,100%);height:76px;font-size:34px;border-radius:999px;justify-self:center;margin-top:2px}
  .start svg{width:.8em;height:.8em}

  /* ================= PLAY ================= */
  #play .logo-sm{position:absolute;left:24px;top:18px;width:clamp(150px,17vw,230px);filter:drop-shadow(0 6px 12px rgba(0,0,0,.5))}
  .topnav{position:absolute;right:24px;top:18px;display:flex;gap:12px;z-index:2}
  #play .safe{justify-content:center}
  .stats{display:flex;align-items:center;gap:14px;margin-bottom:22px}
  .stat{
    min-width:130px;padding:12px 16px;text-align:center;
    background:var(--panel);border:2px solid var(--panel-border);border-radius:16px;
    box-shadow:0 6px 20px rgba(0,0,0,.4);
  }
  .stat .k{font-size:13px;font-weight:700;letter-spacing:.06em;opacity:.9}
  .stat .v{font-size:38px;font-weight:800;line-height:1.05}
  .stat .v small{font-size:20px;font-weight:700;opacity:.85}
  .stat.combo .k{color:var(--yellow)}
  .stat.combo .v{color:#FB7185}
  .timer{position:relative;width:150px;height:150px;display:grid;place-items:center;background:var(--panel);border-radius:50%;box-shadow:0 6px 20px rgba(0,0,0,.4)}
  .timer svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
  .timer .ring-bg{fill:none;stroke:rgba(148,197,255,.3);stroke-width:10}
  .timer .ring{fill:none;stroke:var(--cyan);stroke-width:10;stroke-linecap:round;filter:drop-shadow(0 0 6px rgba(34,211,238,.9))}
  .timer .t{text-align:center;line-height:1}
  .timer .t .k{font-size:13px;font-weight:700;letter-spacing:.06em;opacity:.9}
  .timer .t .v{font-size:44px;font-weight:800}
  .timer .t .u{font-size:13px;font-weight:700;opacity:.85}
  .stage{width:min(700px,100%);position:relative}
  .wordcard{
    user-select:none;-webkit-user-select:none;
    position:relative;width:100%;min-height:210px;
    background:var(--cream);color:var(--navy);
    border:4px solid var(--yellow);border-radius:26px;
    padding:18px 60px;text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.45);overflow:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  }
  .wordcard::before,.wordcard::after{ /* seigaiha wave motif */
    content:"";position:absolute;bottom:-10px;width:150px;height:70px;opacity:.28;
    background-image:radial-gradient(circle at 50% 100%,transparent 18px,#F6C46A 19px,#F6C46A 21px,transparent 22px,transparent 30px,#F6C46A 31px,#F6C46A 33px,transparent 34px,transparent 42px,#F6C46A 43px,#F6C46A 45px,transparent 46px);
    background-size:60px 30px;background-position:0 0;
  }
  .wordcard::before{left:-10px}.wordcard::after{right:-10px}
  .ja-slot{height:66px;display:flex;align-items:flex-end;justify-content:center;width:100%}
  .wordcard .ja{font-family:var(--font-ja-round);font-size:36px;font-weight:700;color:#1D4ED8;position:relative;word-break:keep-all;overflow-wrap:normal;line-height:1.25;width:100%}
  .wordcard .ja.long{font-size:26px}
  .wordcard .ja.xlong{font-size:22px}
  .wordcard .sep{width:60%;height:0;border-top:3px dotted rgba(15,23,42,.35);margin:8px auto 6px}
  .wordcard .en{font-size:66px;font-weight:800;letter-spacing:.02em;line-height:1.05;position:relative}
  .card-tools{position:absolute;left:calc(100% + 18px);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:flex-start;gap:10px}
  .speaker{width:58px;height:58px;border:3px solid var(--panel-border);border-radius:50%;background:var(--navy);display:grid;place-items:center;box-shadow:0 4px 10px rgba(0,0,0,.3)}
  .speaker svg{width:30px;height:30px;fill:#fff}
  .hint{
    display:inline-flex;align-items:center;gap:10px;padding:12px 20px;border-radius:14px;
    background:rgba(15,23,42,.85);color:#fff;border:3px solid var(--yellow);
    font-size:22px;font-weight:700;box-shadow:0 6px 16px rgba(0,0,0,.4);white-space:nowrap;
  }
  .hint svg{width:26px;height:26px;fill:none;stroke:var(--yellow);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
  .inputwrap{width:min(700px,100%);margin-top:18px}
  .typebox{
    width:100%;height:82px;padding:0 26px;
    font-family:var(--font-en);font-size:34px;font-weight:700;color:var(--navy);
    background:#fff;border:5px solid var(--blue);border-radius:20px;
    box-shadow:0 0 0 4px rgba(96,165,250,.35),0 10px 30px rgba(0,0,0,.45);
  }
  .typebox::placeholder{color:#94A3B8;font-weight:700}
  .play-foot{margin-top:34px;display:flex;justify-content:center}
  .cheer{font-style:italic;font-weight:700;font-size:16px;line-height:1.25;color:#FFE9A8;text-shadow:0 2px 6px rgba(0,0,0,.6)}
  .stars{display:flex;gap:8px;padding:10px 20px;border-radius:999px;background:rgba(15,23,42,.75);border:2px solid var(--panel-border)}
  .stars svg{width:30px;height:30px;fill:#475569}
  .stars svg.on{fill:var(--yellow);filter:drop-shadow(0 0 4px rgba(250,204,21,.8))}

  /* ================= RESULT ================= */
  #result .logo-sm{position:absolute;left:24px;top:14px;width:clamp(140px,16vw,220px);filter:drop-shadow(0 6px 12px rgba(0,0,0,.5))}
  #result .safe{justify-content:flex-start}
  .result-title{text-align:center;position:relative}
  .result-title h1{
    font-size:clamp(56px,8vw,86px);font-weight:800;letter-spacing:.04em;line-height:1;
    color:#FDE047;
    background:linear-gradient(180deg,#FFF7C2 0%,#FDE047 45%,#F59E0B 100%);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    filter:drop-shadow(0 4px 0 #7C2D12) drop-shadow(0 8px 14px rgba(0,0,0,.5));
  }
  .result-title .spark{position:absolute;top:10px;width:56px;height:56px;fill:#FDE047;filter:drop-shadow(0 0 8px rgba(253,224,71,.9)) drop-shadow(0 3px 0 #B45309);animation:twinkle 1.8s ease-in-out infinite}
  .result-title .spark.l{left:-70px}.result-title .spark.r{right:-70px;animation-delay:.9s}
  @keyframes twinkle{0%,100%{transform:scale(.85);opacity:.75}50%{transform:scale(1.1);opacity:1}}
  .ribbon{
    display:inline-block;margin-top:6px;padding:8px 34px;
    background:linear-gradient(180deg,#FDE047,#F59E0B);color:#1E1B4B;
    font-size:24px;font-weight:800;letter-spacing:.02em;border-radius:6px;
    clip-path:polygon(0 0,100% 0,96% 50%,100% 100%,0 100%,4% 50%);
    box-shadow:0 6px 14px rgba(0,0,0,.4);
  }
  .greatjob{position:absolute;right:40px;top:104px;font-size:clamp(28px,3.4vw,44px);font-style:italic;font-weight:700;color:#67E8F9;text-shadow:0 0 12px rgba(103,232,249,.8),0 3px 6px rgba(0,0,0,.6);transform:rotate(-6deg)}
  .result-body{display:grid;grid-template-columns:1fr auto;align-items:center;gap:40px;margin-top:18px}
  .result-body.no-record{grid-template-columns:1fr}
  .result-body.no-record .scores{justify-self:center}
  .result-body.no-record .newrecord{display:none}
  .scores{width:min(620px,100%);padding:6px 34px 6px 30px;justify-self:end;overflow:visible}
  .scores .r{display:grid;grid-template-columns:40px 1fr 110px;align-items:center;gap:16px;padding:12px 0;border-bottom:2px solid rgba(148,197,255,.25);overflow:visible}
  .scores .r:last-child{border-bottom:0}
  .scores .r .k{font-size:22px;font-weight:700;letter-spacing:.04em}
  .scores .r .v{position:relative;font-size:40px;font-weight:800;line-height:1;text-align:right;font-variant-numeric:tabular-nums}
  .scores .r .v .unit{position:absolute;left:100%;top:2px;margin-left:2px;font-size:20px;font-weight:700;opacity:.85}
  .scores .r .v small{font-size:22px;font-weight:700;opacity:.85}
  .scores .ic{width:36px;height:36px}
  .newrecord{width:clamp(180px,22vw,290px);height:auto;filter:drop-shadow(0 8px 16px rgba(0,0,0,.5));justify-self:start}
  .result-actions{display:flex;gap:22px;margin-top:30px}
  .result-actions .btn{min-width:214px;height:72px;padding:0 30px;font-size:24px;line-height:1;justify-content:center}

  /* ---------- small viewports (Windows w/ browser UI, iPad) ---------- */
  @media (max-height:700px){
    #home .logo{width:200px;margin-top:-4px}
    #home .panel.main{gap:10px;padding:14px 20px 16px}
    .mode{min-height:62px}.mode b{font-size:22px}
    .time{padding:9px 6px;font-size:16px}
    .start{height:70px;font-size:32px}
    .mode{min-height:72px}.mode .ico{width:54px;height:54px}.mode b{font-size:24px}
    .stat .v{font-size:32px}.timer{width:130px;height:130px}
    .wordcard{min-height:170px}
    .ja-slot{height:50px}
    .wordcard .en{font-size:54px}.wordcard .ja{font-size:28px}
    .typebox{height:70px;font-size:28px}
    .result-title h1{font-size:60px}.ribbon{font-size:20px}
    .scores .r{padding:8px 0}.scores .r .v{font-size:32px}
    .result-actions .btn{height:60px;font-size:20px}
  }
  @media (max-width:1180px){
    .card-tools{position:static;transform:none;flex-direction:row;justify-content:flex-end;width:100%;margin-top:10px}
  }
  @media (max-width:1100px){
    #play .logo-sm,#result .logo-sm{width:150px}
    .greatjob{top:150px;right:24px;font-size:24px}
    .result-title h1{font-size:64px}
    .result-body{gap:20px}
  }
  @media (max-width:820px){
    .result-body{grid-template-columns:1fr}
    .newrecord{justify-self:center;width:180px}
    .result-actions .btn{width:150px;font-size:18px}
    .fw{display:none}
  }
  @media (prefers-reduced-motion:reduce){ .btn{transition:none} }


  /* ---------- UI typeface (buttons, labels, numbers) ---------- */
  .btn,.label,.chip,.icon-btn,.mode b,.mode small,.time,.toggle,.meaning p,
  .stat .k,.stat .v,.timer .t,.hint,.cheer,.scores .r .k,.scores .r .v,.ribbon,.greatjob,
  .modal h2,.modal .close,.modal .idrow label,.modal input.idbox,.praise-pop,#countdown{font-family:var(--font-ui)}
  .btn,.mode b,.time,.stat .v,.scores .r .v,.icon-btn,.label{font-weight:600}
  .start,.result-actions .btn,.result-title h1{font-weight:700}
  .stat .v,.timer .t .v,.scores .r .v{font-variant-numeric:tabular-nums}
  .stat .v{position:relative;display:inline-block}
  .stat .v .unit{font-size:.5em;font-weight:700;opacity:.85;margin-left:1px}
  /* mode cards: depth */
  .mode{position:relative;overflow:hidden}
  .mode::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,0) 55%);pointer-events:none}
  .mode .ico{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
  .mode .ico svg{width:34px;height:34px;fill:#fff;stroke:none}
  .mode b{letter-spacing:.06em;text-shadow:0 2px 0 rgba(0,0,0,.25)}
  .mode small{font-weight:500;letter-spacing:.02em}
  .start{letter-spacing:.08em;text-shadow:0 1px 0 rgba(255,255,255,.5)}
  .time{letter-spacing:.02em}
  .icon-btn{letter-spacing:.06em}
  .label{letter-spacing:.14em;opacity:.95}
  .label svg{opacity:.9}
  .cheer{font-size:24px;font-style:normal;font-weight:600;letter-spacing:.02em;text-align:center;line-height:1.2}


  /* ---------- premium polish (visual only) ---------- */
  .panel.main{background:linear-gradient(180deg,rgba(30,41,59,.82),rgba(15,23,42,.86));border:2px solid rgba(148,197,255,.55);box-shadow:0 20px 50px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.22)}
  .mode{min-height:86px;padding:12px 20px;border-radius:24px;gap:16px;grid-template-columns:64px 1fr;transition:transform .12s,box-shadow .12s}
  .mode-copy{background:linear-gradient(180deg,#7DD3FC 0%,#3B82F6 55%,#2563EB 100%);border:3px solid #1E3A8A;box-shadow:0 7px 0 #1E3A8A,0 14px 26px rgba(0,0,0,.45)}
  .mode-recall{background:linear-gradient(180deg,#FBCFE8 0%,#EC4899 55%,#DB2777 100%);border:3px solid #831843;box-shadow:0 7px 0 #831843,0 14px 26px rgba(0,0,0,.45)}
  .mode::after{background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.08) 48%,rgba(255,255,255,0) 52%)}
  .mode:hover{transform:translateY(-2px)}
  .mode:active{transform:translateY(4px)}
  .mode-copy:active{box-shadow:0 3px 0 #1E3A8A,0 8px 16px rgba(0,0,0,.4)}
  .mode-recall:active{box-shadow:0 3px 0 #831843,0 8px 16px rgba(0,0,0,.4)}
  .mode.is-selected{outline:0}
  .mode-copy.is-selected{box-shadow:0 0 0 4px #fff,0 0 0 7px rgba(59,130,246,.55),0 7px 0 #1E3A8A,0 14px 26px rgba(0,0,0,.45),0 0 26px rgba(255,255,255,.5)}
  .mode-recall.is-selected{box-shadow:0 0 0 4px #fff,0 0 0 7px rgba(236,72,153,.55),0 7px 0 #831843,0 14px 26px rgba(0,0,0,.45),0 0 26px rgba(255,255,255,.5)}
  .mode:not(.is-selected){filter:saturate(.75) brightness(.9)}
  .mode .ico{width:64px;height:64px;background:#fff;box-shadow:0 3px 0 rgba(0,0,0,.25),inset 0 -3px 0 rgba(0,0,0,.08);position:relative;z-index:1}
  .mode-copy .ico svg{fill:#2563EB;width:40px;height:40px}
  .mode-recall .ico svg{fill:#DB2777;width:40px;height:40px}
  .mode b{font-size:28px;position:relative;z-index:1;text-shadow:0 2px 0 rgba(0,0,0,.35),0 0 12px rgba(255,255,255,.25)}
  .mode small{font-size:14px;position:relative;z-index:1;text-shadow:0 1px 0 rgba(0,0,0,.35)}

  /* ---------- phase 2 ---------- */
  .wordcard .en.is-hidden{display:none}

  #fwLayer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:1}

  .fx img{display:block;width:100%;height:auto}
  @keyframes burst{0%{transform:translate(-50%,-50%) scale(.15);opacity:0}15%{opacity:1}55%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-56%) scale(1.08);opacity:0}}
  .praise-pop{position:fixed;left:50%;top:22%;transform:translate(-50%,-50%);font-size:52px;font-weight:800;color:var(--yellow);text-shadow:0 3px 0 #7C2D12,0 6px 18px rgba(0,0,0,.6);pointer-events:none;z-index:3;animation:pop 1s ease-out forwards;font-style:italic}
  @keyframes pop{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}70%{opacity:1}100%{opacity:0;transform:translate(-50%,-90%) scale(1)}}
  #countdown{position:fixed;inset:0;display:none;place-items:center;background:rgba(15,23,42,.55);z-index:5;font-size:160px;font-weight:800;color:var(--yellow);text-shadow:0 6px 0 #7C2D12,0 12px 30px rgba(0,0,0,.6)}
  #countdown.is-on{display:grid}
  .modal{position:fixed;inset:0;display:none;place-items:center;background:rgba(15,23,42,.6);z-index:6;backdrop-filter:blur(3px)}
  .modal.is-on{display:grid}
  .modal .box{width:min(560px,92vw);}
  .modal .box.wide{width:min(960px,94vw);}
  .modal .box{max-height:88vh;overflow:auto;padding:26px 30px;border-radius:20px;background:#0F172A;border:2px solid var(--panel-border);box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .modal h2{font-size:26px;font-weight:800;letter-spacing:.04em;margin-bottom:14px;color:var(--yellow)}

  .modal input,.modal select{width:100%;height:46px;padding:0 14px;font:inherit;font-size:18px;color:#0F172A;background:#fff;border:2px solid var(--blue);border-radius:10px}
  .modal .best-table{display:grid;grid-template-columns:1fr 84px 84px 74px;column-gap:14px;row-gap:2px}
  .modal .best-table .h{font-size:12px;font-weight:700;letter-spacing:.06em;opacity:.65;padding-bottom:6px;text-align:right}
  .modal .best-table .h:first-child{text-align:left}
  .modal .best-table .lbl{font-size:15px;padding:10px 0;border-top:1px solid rgba(148,197,255,.25);align-self:center}
  .modal .best-table .num{font-size:19px;font-weight:800;text-align:right;padding:10px 0;border-top:1px solid rgba(148,197,255,.25);align-self:center;position:relative;font-variant-numeric:tabular-nums}
  .modal .best-table .num .unit{position:absolute;left:100%;font-size:12px;font-weight:700;opacity:.75;margin-left:1px}
  .modal .muted{opacity:.7;font-size:14px}
  .modal .idrow{display:flex;align-items:center;justify-content:center;gap:10px;margin:18px 0 14px}
  .modal .idrow label{margin:0 4px 0 0;font-size:15px}
  .modal .idrow .dash{font-size:28px;font-weight:800;margin:0 8px}
  .modal input.idbox{width:3.2em;height:56px;padding:0;text-align:center;font-size:28px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
  .rank-tabs{display:flex;gap:10px;margin:14px 0}
  .rank-tab{flex:1;padding:10px 0;border-radius:12px;font-weight:700;letter-spacing:.04em;background:rgba(15,23,42,.6);border:2px solid var(--panel-border);color:#fff;opacity:.7}
  .rank-tab.is-on{opacity:1;background:linear-gradient(180deg,#7DD3FC,#3B82F6 55%,#2563EB);border-color:#fff}
  .best-table .lbl.is-me{color:var(--yellow)}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);padding:10px 18px;border-radius:12px;background:rgba(15,23,42,.9);border:2px solid var(--panel-border);font-size:14px;z-index:7;display:none}
  .toast.is-on{display:block}
</style>

      <button class="btn btn-blue" type="button" data-go="home"><svg viewBox="0 0 24 24"><path d="M12 3l9 8h-3v9h-4v-6h-4v6H6v-9H3z"/></svg>HOME</button>
      <button class="btn btn-pink" type="button" id="tryAgain"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>TRY AGAIN</button>
      <button class="btn btn-yellow" type="button" data-nav="RANKING"><svg viewBox="0 0 24 24"><path d="M4 12h4v8H4zm6-7h4v15h-4zm6 4h4v11h-4z"/></svg>RANKING</button>
    </div>
  </section>

<div id="fwLayer" aria-hidden="true"></div>
<div id="countdown" aria-hidden="true">3</div>

<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="box">
    <div id="modalBody"></div>
    <button class="btn btn-blue close" type="button" id="modalClose">CLOSE</button>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   PICKS HANABI — Phase 2 (local features, no GAS yet)
   ========================================================= */

/* ---- 1 place to tune fireworks (category → style, combo → tier) ---- */
const FIREWORK_CONFIG = {
  styles: {
    blue:    { img: 'assets/firework_basic_blue.png', filter: '' },
    gold:    { img: 'assets/firework_large_gold.png', filter: '' },
    pink:    { img: 'assets/firework_basic_blue.png', filter: 'hue-rotate(110deg) saturate(1.3)' },
    rainbow: { img: 'assets/firework_rainbow.png',    filter: '' },
    double:  { img: 'assets/firework_double.png',     filter: '' },
    star:    { img: 'assets/firework_star.png',       filter: '' },
    heart:   { img: 'assets/firework_heart.png',      filter: '' },
    finale:  { img: 'assets/firework_finale.png',     filter: '' },
  },
  // category → style for ordinary (1–2 combo) hits. Mirrors the Categories sheet.
  category: {
    verb:'gold', modal:'rainbow', preposition:'blue', question:'pink', pronoun:'blue',
    conjunction:'rainbow', adverb:'gold', adjective:'pink', determiner:'gold', default:'blue',
  },
  // combo milestones (checked from the top). size = px width on a 1366 screen.
  tiers: [
    { min:20, style:'finale',  size:460, count:3, praise:'AMAZING!!' },
    { min:15, style:'rainbow', size:420, count:2, praise:'Fantastic!' },
    { min:10, style:'heart',   size:400, count:1, praise:'Excellent!' },
    { min:7,  style:'star',    size:380, count:1, praise:'Wonderful!' },
    { min:5,  style:'double',  size:360, count:2, praise:'Great!' },
    { min:3,  style:'gold',    size:360, count:1, praise:'Nice!' },
    { min:1,  style:null,      size:260, count:1, praise:'' },
  ],
};
const STAR_COMBOS = [1, 3, 5, 10, 15];
const STREAK = { from: 5, everyMs: 1100, minEveryMs: 450, sizes: [140, 220] };   // background bursts during a streak       // 5 stars at the bottom of PLAY
const CHEERS = ['Good job! Keep going!', 'Nice! Light it up!', 'You got it! One more!', 'Super! Keep the combo!'];

/* ---- fallback words (used only if words.json cannot be loaded) ---- */
const FALLBACK_WORDS = [
  {ja:'～である／いる',en:'be',category:'verb'},{ja:'持っている',en:'have',category:'verb'},{ja:'行く',en:'go',category:'verb'},
  {ja:'来る',en:'come',category:'verb'},{ja:'～できる',en:'can',category:'modal'},{ja:'～だろう',en:'will',category:'modal'},
  {ja:'～の中に',en:'in',category:'preposition'},{ja:'～の上に',en:'on',category:'preposition'},{ja:'何',en:'what',category:'question'},
  {ja:'だれ',en:'who',category:'question'},{ja:'私',en:'I',category:'pronoun'},{ja:'あなた',en:'you',category:'pronoun'},
  {ja:'そして',en:'and',category:'conjunction'},{ja:'～なので',en:'because',category:'conjunction'},{ja:'いつも',en:'always',category:'adverb'},
  {ja:'とても',en:'very',category:'adverb'},{ja:'大きい',en:'big',category:'adjective'},{ja:'幸せな',en:'happy',category:'adjective'},
  {ja:'いくつかの',en:'some',category:'determiner'},{ja:'すべての',en:'every',category:'determiner'},
];

/* ---- state ---- */
const $ = id => document.getElementById(id);
const settings = {
  mode: 'COPY', time: 60, meaning: true,
  cls: localStorage.getItem('ph_class') || '', num: localStorage.getItem('ph_number') || '',
};
let WORDS = [];
let game = null;
let inputLocked = false;   // true during the 3-2-1 countdown: keystrokes are ignored
let cdTimer = null;        // countdown interval, cleared when the game is stopped

function lockInput(on) {
  inputLocked = on;
  const tb = $('typebox');
  tb.value = '';
  tb.placeholder = on ? 'Ready...' : 'Type here...';
  document.querySelector('.inputwrap').classList.toggle('is-locked', on);
}

/* ---- screens ---- */
const show = id => {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('is-active', s.id === id));
  document.body.dataset.screen = id;
  if (id === 'play') $('typebox').focus();
};
document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => { if (game) stopGame(); show(b.dataset.go); }));

/* ---- HOME controls ---- */
document.querySelectorAll('.mode').forEach(b => b.addEventListener('click', () => {
  settings.mode = b.dataset.mode;
  document.querySelectorAll('.mode').forEach(x => x.classList.toggle('is-selected', x === b));
  $('meaningBox').style.opacity = settings.mode === 'RECALL' ? .45 : 1;   // RECALL always shows Japanese
}));
document.querySelectorAll('.time').forEach(b => b.addEventListener('click', () => {
  settings.time = +b.dataset.time;
  document.querySelectorAll('.time').forEach(x => x.classList.toggle('is-selected', x === b));
}));
$('meaningToggle').addEventListener('click', () => {
  settings.meaning = !settings.meaning;
  const t = $('meaningToggle');
  t.textContent = settings.meaning ? 'ON' : 'OFF';
  t.style.background = settings.meaning ? 'var(--blue)' : '#475569';
  t.setAttribute('aria-pressed', settings.meaning);
});
$('startBtn').addEventListener('click', startGame);
$('tryAgain').addEventListener('click', startGame);

/* ---- words ---- */
const API_BASE = 'https://script.google.com/macros/s/AKfycbyFVh9mer_RYFupFwVyOZbWpBwk4BoGasmF8NomSbr14RN4_FzVXZxqjRgoo9_1KXx10w/exec';

async function loadWords() {
  // 1) live spreadsheet via GAS  2) local words.json  3) built-in 20-word list
  try {
    const r = await fetch(`${API_BASE}?action=words`, { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    const list = (data.words || []).filter(w => w && w.ja && w.en);
    if (list.length < 5) throw new Error('too few words');
    WORDS = list;
    return;
  } catch (e) { /* fall through */ }
  try {
    const r = await fetch('words.json', { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    const data = await r.json();
    const list = (data.words || []).filter(w => w && w.ja && w.en && (w.enabled === undefined || w.enabled));
    if (list.length < 5) throw new Error('too few words');
    WORDS = list;
  } catch (e) {
    WORDS = FALLBACK_WORDS;
    toast('Using built-in word list (offline)');
  }
}

function apiGet(params) {
  return fetch(`${API_BASE}?${new URLSearchParams(params)}`, { cache: 'no-store' }).then(r => r.json()).catch(() => null);
}
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };

/* ---- game ---- */
function startGame() {
  if (!WORDS.length) { toast('単語を読み込み中です。少し待ってからSTARTしてね'); return; }
  if (game) stopGame();
  const deck = shuffle(WORDS.slice());
  game = {
    deck, idx: 0, word: null, timeLeft: settings.time, total: settings.time,
    correct: 0, miss: 0, combo: 0, maxCombo: 0, hintUsed: false, running: false, timer: null, cheerI: 0,
  };
  // reset PLAY UI
  $('pWords').textContent = 0; $('pTotal').textContent = 0; $('pCombo').textContent = 0; $('pAcc').textContent = 100;
  $('pCheer').innerHTML = 'Ready? Type the word!';
  updateTimer();
  const tb = $('typebox'); tb.value = ''; tb.classList.remove('is-miss', 'is-ok');
  const card = document.querySelector('.wordcard');
  card.classList.toggle('recall', settings.mode === 'RECALL');
  $('hintBtn').style.display = settings.mode === 'RECALL' ? '' : 'none';
  $('speakBtn').style.display = settings.mode === 'COPY' ? '' : 'none';
  $('fwLayer').innerHTML = '';
  show('play');
  nextWord();
  if (!game) return;                 // nextWord bailed out (no usable word)
  lockInput(true);                   // no typing until GO!
  tb.focus();
  countdown(() => {
    if (!game) return;               // HOME was pressed during the countdown
    lockInput(false);
    game.running = true;
    game.timer = setInterval(tick, 1000);
    tb.focus();
  });
}
function updateStreak() {
  const c = game.combo;
  document.querySelector('.stat.combo').classList.toggle('is-hot', c >= STREAK.from);
  const num = $('pCombo'); num.classList.remove('pulse'); void num.offsetWidth; num.classList.add('pulse');
  if (c < STREAK.from) { stopStreak(); return; }
  const every = Math.max(STREAK.minEveryMs, STREAK.everyMs - (c - STREAK.from) * 60);
  if (game.streakTimer && game.streakEvery === every) return;
  stopStreak(); game.streakEvery = every;
  game.streakTimer = setInterval(() => {
    if (!game || !game.running) return stopStreak();
    const names = Object.keys(FIREWORK_CONFIG.styles);
    const st = FIREWORK_CONFIG.styles[names[Math.random() * names.length | 0]];
    burst(st, STREAK.sizes[0] + Math.random() * (STREAK.sizes[1] - STREAK.sizes[0]), true);
  }, every);
}
function stopStreak() { if (game && game.streakTimer) clearInterval(game.streakTimer); if (game) game.streakTimer = null; document.querySelector('.stat.combo').classList.remove('is-hot'); }
function stopGame() {
  stopStreak();
  if (game && game.timer) clearInterval(game.timer);
  if (cdTimer) { clearInterval(cdTimer); cdTimer = null; }
  game = null;
  lockInput(false);
  $('countdown').classList.remove('is-on');
}

function countdown(done) {
  const el = $('countdown'); let n = 3;
  if (cdTimer) clearInterval(cdTimer);
  el.textContent = n; el.classList.add('is-on');
  cdTimer = setInterval(() => {
    n--;
    if (n === 0) { el.textContent = 'GO!'; }
    else if (n < 0) { clearInterval(cdTimer); cdTimer = null; el.classList.remove('is-on'); done(); }
    else el.textContent = n;
  }, 700);
}

function tick() {
  if (!game) return;
  game.timeLeft--;
  updateTimer();
  if (game.timeLeft <= 0) endGame();
}
function updateTimer() {
  $('pTime').textContent = game.timeLeft;
  const frac = game.timeLeft / game.total;
  $('pRing').style.strokeDashoffset = 276.5 * (1 - frac);
  $('pRing').style.stroke = game.timeLeft <= 10 ? '#FB7185' : 'var(--cyan)';
}

function nextWord() {
  if (game.idx >= game.deck.length) { shuffle(game.deck); game.idx = 0; }
  game.word = game.deck[game.idx++];
  if (!game.word) {                  // empty word list: stop cleanly instead of freezing
    stopGame(); show('home');
    toast('単語を読み込めませんでした。もう一度STARTを押してね');
    return;
  }
  game.hintUsed = false;
  const ja = game.word.ja;
  $('wJa').innerHTML = ja.replace(/／/g, '／<wbr>');
  $('wJa').className = 'ja' + (ja.length > 14 ? ' xlong' : ja.length > 9 ? ' long' : '');
  $('wEn').textContent = game.word.en;
  const showJa = settings.mode === 'RECALL' || settings.meaning;
  const showEn = settings.mode === 'COPY';
  $('wJa').style.display = showJa ? '' : 'none';
  $('wEn').classList.toggle('is-hidden', !showEn);
  document.querySelector('.wordcard .sep').classList.toggle('is-hidden', !(showJa && showEn));
  $('wHint').textContent = ''; $('wHint').classList.remove('is-on');
  $('hintBtn').classList.remove('is-used');
  const tb = $('typebox'); tb.value = ''; tb.classList.remove('is-miss');
  tb.placeholder = 'Type here...';
}

const toHalfWidth = s => s
  .replace(/[！-～]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xfee0)) // full-width ! ~ -> half-width
  .replace(/　/g, ' ')                                                            // full-width space
  .replace(/[‘’]/g, "'")
  .replace(/[“”]/g, '"');
const norm = s => toHalfWidth(s).trim().toLowerCase().replace(/\s+/g, ' ').replace(/[’]/g, "'");
function judge() {
  if (!game || !game.running) return;
  const tb = $('typebox');
  if (!tb.value.trim()) return;
  if (norm(tb.value) === norm(game.word.en)) onCorrect(); else onMiss();
}
function onCorrect() {
  game.correct++;
  if (!game.hintUsed) game.combo++;
  game.maxCombo = Math.max(game.maxCombo, game.combo);
  launchFireworks(game.combo, game.word.category);
  updateStreak();
  const tier = FIREWORK_CONFIG.tiers.find(t => game.combo >= t.min);
  if (tier && tier.praise && !game.hintUsed && game.combo === tier.min && tier.min >= 3) praisePop(tier.praise);
  setCheer(CHEERS[game.cheerI++ % CHEERS.length]);
  const wrap = document.querySelector('.inputwrap');
  wrap.classList.remove('is-ok'); void wrap.offsetWidth; wrap.classList.add('is-ok');
  updateStats();
  nextWord();
}
function onMiss() {
  game.miss++; game.combo = 0;
  setCheer('Almost! Try again.');
  const tb = $('typebox');
  tb.classList.remove('is-miss'); void tb.offsetWidth; tb.classList.add('is-miss');
  tb.value = '';
  stopStreak();
  updateStats();
}
function updateStats() {
  const tried = game.correct + game.miss;
  $('pWords').textContent = game.correct; $('pTotal').textContent = tried;
  $('pCombo').textContent = game.combo;
  $('pAcc').textContent = tried ? Math.round(game.correct / tried * 100) : 100;
}

$('typebox').addEventListener('keydown', e => {
  if (inputLocked) { e.preventDefault(); return; }              // countdown: swallow every key
  if (e.key === 'Enter') { e.preventDefault(); judge(); }
});
$('typebox').addEventListener('paste', e => e.preventDefault());
$('typebox').addEventListener('drop', e => e.preventDefault());
$('typebox').addEventListener('contextmenu', e => e.preventDefault());
document.querySelector('.wordcard').addEventListener('copy', e => e.preventDefault());
document.querySelector('.wordcard').addEventListener('contextmenu', e => e.preventDefault());
$('typebox').addEventListener('input', () => {
  const tb = $('typebox');
  if (inputLocked) { tb.value = ''; return; }                   // IME etc. during the countdown
  if (!game || !game.running) { tb.value = ''; return; }
  const fixed = toHalfWidth(tb.value);
  if (fixed !== tb.value) { const pos = tb.selectionStart; tb.value = fixed; tb.setSelectionRange(pos, pos); }
  const v = norm(tb.value), t = norm(game.word.en);
  if (!v) return;
  if (v === t) { onCorrect(); return; }              // auto-advance on exact match
  if (!t.startsWith(v)) onMiss();                    // first wrong letter = miss, retype the word
});
$('hintBtn').addEventListener('click', () => {
  if (!game || !game.running || game.hintUsed) return;
  game.hintUsed = true;
  $('wHint').textContent = game.word.en[0] + ' _'.repeat(Math.max(0, game.word.en.length - 1));
  $('wHint').classList.add('is-on');
  $('hintBtn').classList.add('is-used');
  $('typebox').focus();
});
$('speakBtn').addEventListener('click', () => {
  if (!game || !('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(game.word.en); u.lang = 'en-US'; u.rate = .9;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
  $('typebox').focus();
});

/* ---- fireworks ---- */
function launchFireworks(combo, category) {
  const cfg = FIREWORK_CONFIG;
  const tier = cfg.tiers.find(t => combo >= t.min) || cfg.tiers[cfg.tiers.length - 1];
  const styleName = tier.style || cfg.category[category] || cfg.category.default;
  for (let i = 0; i < tier.count; i++) setTimeout(() => burst(cfg.styles[styleName], tier.size), i * 260);
}
function burst(style, size, anywhere) {
  const layer = $('fwLayer'), scale = Math.min(1, innerWidth / 1366);
  const el = document.createElement('div'); el.className = 'fx';
  const w = size * scale;
  // sky band only: y 4–30% of the viewport, x avoids the centre column where the word card lives
  const left = anywhere ? 4 + Math.random() * 92 : (Math.random() < .5 ? 5 + Math.random() * 22 : 68 + Math.random() * 24);
  el.style.cssText = `width:${w}px;left:${left}vw;top:${(anywhere ? 4 : 16) + Math.random() * 20}vh;filter:${style.filter}`;
  el.innerHTML = `<img src="${style.img}" alt="">`;
  layer.appendChild(el);
  setTimeout(() => el.remove(), 1700);
}
function praisePop(text) {
  const el = document.createElement('div'); el.className = 'praise-pop'; el.textContent = text;
  document.body.appendChild(el); setTimeout(() => el.remove(), 1000);
}

/* ---- RESULT & MY BEST (localStorage) ---- */
const bestKey = () => `ph_best_${settings.mode}_${settings.mode === 'COPY' ? (settings.meaning ? 'ON' : 'OFF') : 'NA'}_${settings.time}`;
const better = (a, b) => !b || a.words > b.words || (a.words === b.words && (a.maxCombo > b.maxCombo || (a.maxCombo === b.maxCombo && a.accuracy > b.accuracy)));
function endGame() {
  clearInterval(game.timer); game.running = false; stopStreak();
  const tried = game.correct + game.miss;
  const rec = { words: game.correct, maxCombo: game.maxCombo, accuracy: tried ? Math.round(game.correct / tried * 100) : 0,
                mode: settings.mode, meaning: settings.meaning ? 'ON' : 'OFF', duration: settings.time, playedAt: new Date().toISOString() };
  const prev = JSON.parse(localStorage.getItem(bestKey()) || 'null');
  const isNew = rec.words > 0 && better(rec, prev);
  if (isNew) localStorage.setItem(bestKey(), JSON.stringify(rec));
  $('rWords').textContent = rec.words; $('rCombo').textContent = rec.maxCombo; $('rAcc').textContent = rec.accuracy; $('rFw').textContent = rec.words;
  document.querySelector('.result-body').classList.toggle('no-record', !isNew);
  $('rRibbon').textContent = rec.words === 0 ? 'Let\'s light it up next time!' : rec.words >= 30 ? 'You lit up the whole sky!' : 'You lit up the sky!';
  $('fwLayer').innerHTML = '';
  show('result');
  game.timer = null;

  if (rec.words > 0 && settings.cls && settings.num) {
    // sent as GET: a POST to a GAS web app can be silently downgraded to GET by the
    // browser on the script.google.com -> googleusercontent.com redirect, which drops
    // the body. GET has no body to lose, so it's the reliable path.
    apiGet({
      action: 'submit',
      classNumber: `${settings.cls}-${settings.num}`,
      mode: rec.mode, meaning: rec.meaning, duration: rec.duration,
      words: rec.words, maxCombo: rec.maxCombo, accuracy: rec.accuracy,
    });
  }
}

/* ---- modals: HOW TO PLAY / MY BEST / SETTINGS / RANKING ---- */
document.querySelectorAll('[data-nav]').forEach(b => b.addEventListener('click', () => openModal(b.dataset.nav)));
function openModal(kind) {
  const body = $('modalBody');
  if (kind === 'HOW TO PLAY') body.innerHTML = `
    <h2>あそびかた</h2>
    <p class="ja"><b>COPY</b>：英単語を見て、そのまま入力　／　<b>RECALL</b>：日本語を見て、英単語を思い出して入力</p>
    <ul class="ja">
      <li>正解するたびに花火。連続正解（COMBO）が続くほど花火が豪華になる</li>
      <li>まちがえたら同じ単語をもう一度。COMBOは0にもどる</li>
      <li>Hintは最初の1文字を表示。花火は上がるけど、COMBOは増えない</li>
      <li>大文字・小文字はどちらでもOK</li>
    </ul>
    <p class="muted ja">ランキング：正解数 → 最大COMBO → 正確さ（COPY / RECALL と時間は別ランキング）</p>`;
  else if (kind === 'MY BEST') {
    const cells = [];
    for (const mode of ['COPY', 'RECALL']) for (const m of (mode === 'COPY' ? ['ON', 'OFF'] : ['NA'])) for (const t of [30, 45, 60]) {
      const r = JSON.parse(localStorage.getItem(`ph_best_${mode}_${m}_${t}`) || 'null');
      if (!r) continue;
      cells.push(`<div class="lbl">${mode}${mode === 'COPY' ? ' · meaning ' + m : ''} · ${t}s</div>`);
      cells.push(`<div class="num">${r.words}</div>`);
      cells.push(`<div class="num">${r.maxCombo}</div>`);
      cells.push(`<div class="num">${r.accuracy}<span class="unit">%</span></div>`);
    }
    body.innerHTML = `<h2>MY BEST</h2>` + (cells.length
      ? `<div class="best-table"><div class="h">&nbsp;</div><div class="h">WORDS</div><div class="h">COMBO</div><div class="h">ACC</div>${cells.join('')}</div>`
      : '<p class="muted">No records yet. Play a round!</p>') +
      `<p class="muted" style="margin-top:12px">Saved on this device only.</p>`;
  }
  else if (kind === 'SETTINGS') body.innerHTML = `
    <h2>SETTINGS</h2>
    <p class="ja">クラスと番号を入力（名前は使いません）</p>
    <div class="idrow">
      <label for="setClass">クラス</label><input id="setClass" class="idbox" value="${settings.cls}" maxlength="2" placeholder="2C" autocomplete="off">
      <span class="dash">-</span>
      <label for="setNum">番号</label><input id="setNum" class="idbox" value="${settings.num}" inputmode="numeric" maxlength="2" placeholder="40" autocomplete="off">
    </div>
    <p class="muted ja">ランキングには <b>${settings.cls || '2C'}-${settings.num || '40'}</b> のように表示されます。</p>`;
  else if (kind === 'RANKING') openRanking_('today');
  document.querySelector('#modal .box').classList.toggle('wide', kind === 'HOW TO PLAY');
  $('modal').classList.add('is-on');
}
function openRanking_(scope) {
  const body = $('modalBody');
  const modeLabel = `${settings.mode}${settings.mode === 'COPY' ? ' · meaning ' + (settings.meaning ? 'ON' : 'OFF') : ''} · ${settings.time}s`;
  body.innerHTML = `
    <h2>RANKING</h2>
    <p class="muted">${modeLabel}</p>
    <div class="rank-tabs">
      <button type="button" class="rank-tab ${scope === 'today' ? 'is-on' : ''}" data-scope="today">TODAY</button>
      <button type="button" class="rank-tab ${scope === 'alltime' ? 'is-on' : ''}" data-scope="alltime">ALL-TIME</button>
    </div>
    <div id="rankBody" class="muted" style="padding:24px 0;text-align:center">読み込み中…</div>`;
  body.querySelectorAll('.rank-tab').forEach(b => b.addEventListener('click', () => openRanking_(b.dataset.scope)));

  const params = { action: 'ranking', scope, mode: settings.mode, duration: settings.time };
  if (settings.mode === 'COPY') params.meaning = settings.meaning ? 'ON' : 'OFF';
  apiGet(params).then(data => {
    const el = $('rankBody');
    if (!el) return; // modal closed or switched tab before this resolved
    if (!data || data.error) { el.innerHTML = '通信できませんでした。時間をおいて試してください。'; return; }
    const list = data.ranking || [];
    if (!list.length) { el.innerHTML = 'まだ記録がありません。'; return; }
    const myId = (settings.cls && settings.num) ? `${settings.cls}-${settings.num}` : null;
    const rows = list.map((r, i) => `
      <div class="lbl ${r.classNumber === myId ? 'is-me' : ''}">#${i + 1}　${r.classNumber}</div>
      <div class="num">${r.words}</div>
      <div class="num">${r.maxCombo}</div>
      <div class="num">${r.accuracy}<span class="unit">%</span></div>`).join('');
    el.outerHTML = `<div class="best-table" id="rankBody"><div class="h">&nbsp;</div><div class="h">WORDS</div><div class="h">COMBO</div><div class="h">ACC</div>${rows}</div>`;
  });
}
$('modalClose').addEventListener('click', closeModal);
$('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });
function closeModal() {
  const c = $('setClass'), n = $('setNum');
  if (c && n) { settings.cls = c.value.trim().toUpperCase(); settings.num = n.value.trim(); localStorage.setItem('ph_class', settings.cls); localStorage.setItem('ph_number', settings.num); }
  $('modal').classList.remove('is-on');
  if (game && game.running) $('typebox').focus();
}
function setCheer(t) { const c = $('pCheer'); c.textContent = t; c.classList.remove('bump'); void c.offsetWidth; c.classList.add('bump'); }
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('is-on'); setTimeout(() => t.classList.remove('is-on'), 3500); }

/* ---- boot ---- */
(function boot() {
  const btn = $('startBtn'), lbl = $('startLabel');
  btn.disabled = true; lbl.textContent = 'LOADING...';
  loadWords().finally(() => { btn.disabled = false; lbl.textContent = 'START'; });
  show('home');
})();
</script>
</body>
</html>
